[project]
name = "equitytrace"
version = "0.3.1"
description = "Transparent stock research backed by filings, factors, and historical evidence"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EquityTrace Contributors" }]
keywords = ["sec", "edgar", "xbrl", "quant", "finance", "point-in-time", "factors"]
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "polars>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pytz>=2026.3.post1",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "typer>=0.12.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
equitytrace = "equitytrace.cli:app"
filingedge = "equitytrace.cli:deprecated_filingedge_cli"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
# Non-editable installs avoid a macOS + CPython interaction where editable
# ``.pth`` files can be marked UF_HIDDEN and then ignored by site.py.
config-settings = { editable_mode = "compat" }

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["equitytrace"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
